# News and social sources the agent reads (fpl-agent news-ingest). Override the path with
# NEWS_SOURCES_FILE. Every source is optional: a failing or unconfigured one is skipped and shown
# in `fpl-agent sources`, and the weekly plan runs as before.
#
# tier: 1 = official club/manager channel, 2 = established outlet or named journalist,
#       3 = aggregator or anything else. Tiers weight a claim; they never make it certain.
# min_interval_minutes: a source is not fetched again sooner than this (bounded requests).
# max_items: at most this many items are read per run (and, for X, per account).
defaults:
  min_interval_minutes: 60
  max_items: 60
  timeout_seconds: 20
  max_bytes: 2000000

sources:
  # Verified reachable and parsing on 3 Nov 2026 (RSS 2.0, BBC terms allow metadata reuse).
  - id: bbc-football
    kind: rss
    url: https://feeds.bbci.co.uk/sport/football/rss.xml
    tier: 2
  - id: bbc-premier-league
    kind: rss
    url: https://feeds.bbci.co.uk/sport/football/premier-league/rss.xml
    tier: 2

  # X (formerly Twitter) API v2, user timelines. Needs X_BEARER_TOKEN (app-only bearer token from
  # developer.x.com; reads are billed per post returned). Without the token this source is skipped,
  # never failed. Only the accounts listed here are read: add club and journalist handles yourself.
  - id: x-clubs
    kind: x
    tier: 1
    accounts: []        # e.g. [Arsenal, ManCity, LFC]
    max_items: 20       # per account per run
    max_pages: 1
    min_interval_minutes: 180
  - id: x-journalists
    kind: x
    tier: 2
    accounts: []
    max_items: 20
    max_pages: 1
    min_interval_minutes: 180
