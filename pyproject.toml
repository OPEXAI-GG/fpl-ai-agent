[project]
name = "fpl-agent"
version = "0.1.0"
description = "Autonomous Fantasy Premier League agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.scripts]
fpl-agent = "fpl_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
