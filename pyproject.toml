[project]
name = "fpl-agent"
version = "0.1.0"
description = "Autonomous Fantasy Premier League agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.5.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
fpl-agent = "fpl_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "respx>=0.21",
    "hypothesis>=6.168.5",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits real external services (daily canary only)"]

[tool.coverage.run]
source = ["src/fpl_agent"]
branch = true

[tool.ruff.lint.per-file-ignores]
"src/fpl_agent/db/quality.py" = ["E501"]  # long SQL strings
"tests/test_quality.py" = ["E501"]  # one-line corruption statements
