name: backtest
# Click "Run workflow" once the history backfill has finished. Scores the projection stack on a
# past season using only data available before each deadline, and compares it with simple
# baselines (last 5 games, FPL's own expected points). Read-only: changes nothing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "projections: score the projections (GW range below); replay: run the agent through the whole season with the real planner and chips, scored on real points; retro: what the agent would decide for one gameweek (from_gw) against the team you submitted"
        type: choice
        options: [projections, replay, retro]
        default: projections
      season:
        description: "season start year to test (2025 = 2025/26)"
        default: "2025"
      from_gw:
        description: "first gameweek"
        default: "10"
      to_gw:
        description: "last gameweek"
        default: "30"
      settings:
        description: "replay only: settings to try, space-separated, e.g. hit_buffer=1.5 min_gain.bboost=12"
        default: ""
      explain_players:
        description: "optional: skip the back-test and explain these players in the latest plan (name fragments, comma-separated)"
        default: ""
      explain_gw:
        description: "gameweek for the explanation"
        default: "6"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Restore database
        run: scripts/data_restore.sh data_cache/export
      - name: Explain players in the latest plan
        if: ${{ github.event.inputs.explain_players != '' }}
        env:
          GW: ${{ github.event.inputs.explain_gw }}
          PLAYERS: ${{ github.event.inputs.explain_players }}
        run: |
          set -o pipefail
          uv run fpl-agent explain --db data_cache/football.duckdb --import-dir data_cache/export \
            --season 2026 --gw "$GW" --players "$PLAYERS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Back-test
        if: ${{ github.event.inputs.explain_players == '' && github.event.inputs.mode == 'projections' }}
        run: |
          set -o pipefail  # a crash must fail the run, not be hidden by tee
          uv run fpl-agent backtest --db data_cache/football.duckdb --import-dir data_cache/export \
            --season "${{ github.event.inputs.season }}" --from-gw "${{ github.event.inputs.from_gw }}" \
            --to-gw "${{ github.event.inputs.to_gw }}" --out backtest.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Season replay
        if: ${{ github.event.inputs.explain_players == '' && github.event.inputs.mode == 'replay' }}
        env:
          SETTINGS: ${{ github.event.inputs.settings }}
        run: |
          set -o pipefail
          sets=()
          for s in $SETTINGS; do sets+=(--set "$s"); done
          uv run fpl-agent replay --db data_cache/football.duckdb --import-dir data_cache/export \
            --season "${{ github.event.inputs.season }}" "${sets[@]}" --out backtest.csv \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gameweek retro
        if: ${{ github.event.inputs.explain_players == '' && github.event.inputs.mode == 'retro' }}
        env:
          FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
          SETTINGS: ${{ github.event.inputs.settings }}
        run: |
          set -o pipefail
          sets=()
          for s in $SETTINGS; do sets+=(--set "$s"); done
          uv run fpl-agent retro --db data_cache/football.duckdb --import-dir data_cache/export \
            --season "${{ github.event.inputs.season }}" --gw "${{ github.event.inputs.from_gw }}" \
            "${sets[@]}" --out retro.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: |
            backtest.csv
            retro.md
          if-no-files-found: ignore
