name: canary
# Daily check that every real data source still looks the way our parsers expect.
# A red run means a source changed or is down: fix the adapter before the next weekly update.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Live contract tests
        run: uv run pytest tests/live -m live -q
      - name: Alert on failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK || secrets.Discord_webhook }}
        run: |
          uv run python -c "from fpl_agent.notify import send; send('FPL agent canary FAILED: a data source changed or is down. See the canary workflow run.')"
