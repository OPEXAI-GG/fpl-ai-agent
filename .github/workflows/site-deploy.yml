name: site-deploy
# Puts the FPL Sim website online (a Cloudflare Worker with a D1 database), applies database
# migrations, and sets up Stripe's products, prices, portal and webhook. Runs by hand and after
# any change under web/ reaches master. Advice only: it never touches any FPL team.
# Secrets it uses when present: CLOUDFLARE_API_TOKEN (needs Workers and D1 edit), STRIPE_SECRET_KEY,
# RESEND_API_KEY, DISCORD_BOT_GITHUB_TOKEN (lets a new subscriber's plan start straight away).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/site-deploy.yml"]
permissions:
  contents: read
concurrency:
  group: site-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        working-directory: web
        run: |
          npm ci
          npm test
      - name: Work out the address
        run: scripts/site_env.sh
      - name: Create the database if needed and apply migrations
        working-directory: web
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "fplsim") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create fplsim
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "fplsim") | .uuid')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 migrations apply fplsim --remote
      - name: Deploy the Worker
        working-directory: web
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.DISCORD_BOT_GITHUB_TOKEN }}
        run: |
          if [ -n "$SITE_ZONE" ]; then
            printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$SITE_ZONE" >> wrangler.toml
          else
            sed -i 's|^SITE_URL = .*|SITE_URL = ""|' wrangler.toml   # links use the address in use
          fi
          npx wrangler deploy
          for name in STRIPE_SECRET_KEY RESEND_API_KEY ENGINE_TOKEN GITHUB_DISPATCH_TOKEN; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx wrangler secret put "$name"; fi
          done
      - name: Set up Stripe
        working-directory: web
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-setup.mjs
      - name: Show the address
        run: |
          echo "FPL Sim is online at ${SITE_URL:-your workers.dev address}" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS "$SITE_URL/healthz" || echo "(health check failed: the first deploy can take a minute)"
