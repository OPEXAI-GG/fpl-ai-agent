name: plan
# Weekly decision in DRY-RUN mode: transfers, chip, XI, captain, written to the run summary and
# (if NOTIFY_WEBHOOK is set) sent to you. Nothing here logs in to FPL or changes your team;
# AGENT_MODE is fixed to `dry` in this file on purpose. Runs every 2 hours; the agent acts only
# when a deadline is 2-26 hours away and notifies once per gameweek.
on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "ignore the deadline-window gate (true/false)"
        default: "false"
permissions:
  contents: write           # publishes the database (decisions and projections are recorded in it)
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ vars.FPL_ENTRY_ID != '' }}   # idle until you set your team id
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_MODE: dry
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Restore database
        run: scripts/data_restore.sh data_cache/export
      - name: Refresh prices, news and fixtures
        run: |
          uv run fpl-agent db-update --db data_cache/football.duckdb --import-dir data_cache/export \
            --football-data E0
      - name: Plan (dry run)
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          uv run fpl-agent plan --db data_cache/football.duckdb --export data_cache/out --out plan_out --notify $FORCE \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan
          path: plan_out
          if-no-files-found: ignore
      - name: Publish database
        run: scripts/data_publish.sh data_cache/out
