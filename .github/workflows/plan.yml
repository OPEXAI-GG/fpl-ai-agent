name: plan
# Weekly decision: transfers, chip, XI, captain.
# THE ONE SWITCH: the repository variable AGENT_MODE.
#   unset or "dry"  -> report only. Nothing logs in to FPL; your team is never touched (default).
#   "live"          -> the agent makes the moves on your FPL team itself, then reports what it did.
# AGENT_ENABLED=false stops everything either way. Runs every 2 hours; the agent acts only when a
# deadline is 45 minutes to 26 hours away (re-planning on every run, so the last run uses the
# latest team news) and notifies once per gameweek, or again when it changes the team.
on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "ignore the deadline-window gate (true/false)"
        default: "false"
      dry:
        description: "report only, whatever AGENT_MODE says: no FPL sign-in, no Discord (true/false)"
        default: "false"
      discord_reply:
        description: "set by the Discord bot so the report comes back to the /plan command; leave empty"
        default: ""
permissions:
  contents: write           # publishes the database (decisions and projections are recorded in it)
  actions: read             # lets the gate below see how long this run waited in the queue
concurrency:
  # a dry check neither signs in nor publishes the database, so it need not queue behind them
  group: ${{ github.event.inputs.dry == 'true' && 'plan-dry' || 'data' }}
  cancel-in-progress: false
jobs:
  # FPL's login token is single-use and a queued run is handed the token that was current when it
  # was queued. A run that waited behind another one therefore holds a token that has already
  # been replaced, and using it would revoke the new one. Such a run stops here; the next
  # scheduled run (or a new button press) starts clean.
  gate:
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.wait.outputs.fresh }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          REPLY: ${{ inputs.discord_reply }}
        run: |
          if [ -n "$REPLY" ]; then echo "::add-mask::$REPLY"; fi
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at || true)
          waited=0
          if [ -n "$started" ]; then waited=$(( $(date +%s) - $(date -d "$started" +%s) )); fi
          if [ "$waited" -gt 180 ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            msg="This run waited ${waited}s behind another run, so its FPL login token may be out of date. Skipped; start it again."
            echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$REPLY" ] && [ -n "$DISCORD_APP_ID" ]; then   # tell the /plan command why
              curl -sS -o /dev/null -X POST -H "Content-Type: application/json" \
                -d "{\"content\": \"$msg\"}" "https://discord.com/api/v10/webhooks/$DISCORD_APP_ID/$REPLY" || true
            fi
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
  plan:
    needs: gate
    if: ${{ needs.gate.outputs.fresh == 'true' && vars.FPL_ENTRY_ID != '' }}   # idle until you set your team id
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      AGENT_MODE: ${{ github.event.inputs.dry == 'true' && 'dry' || vars.AGENT_MODE || 'dry' }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK || secrets.Discord_webhook }}
      # only read when AGENT_MODE is live
      FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
      FPL_TOKEN_URL: ${{ vars.FPL_TOKEN_URL }}
      FPL_CLIENT_ID: ${{ vars.FPL_CLIENT_ID }}
      DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
      REPLY: ${{ inputs.discord_reply }}   # Discord /plan reply token, lasts 15 minutes
    steps:
      - name: Hide the Discord reply token
        if: ${{ inputs.discord_reply != '' }}
        run: echo "::add-mask::$REPLY"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Restore database
        run: scripts/data_restore.sh data_cache/export
      - name: Refresh prices, news and fixtures
        run: |
          uv run fpl-agent db-update --db data_cache/football.duckdb --import-dir data_cache/export \
            --football-data E0
      - name: Check settings
        run: uv run fpl-agent status | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Plan
        env:
          # lets the agent store FPL's rotating login token back into the repo secret (live only)
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT || github.token }}
        run: |
          set -o pipefail   # a failed plan must fail the run, not hide behind tee
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          NOTIFY="--notify"
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then NOTIFY=""; fi
          uv run fpl-agent plan --db data_cache/football.duckdb --export data_cache/out --out plan_out $NOTIFY $FORCE \
            | tee -a "$GITHUB_STEP_SUMMARY" plan_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan
          path: plan_out
          if-no-files-found: ignore
      - name: Publish database
        # a forced dry check leaves the stored database as it was (its decision would otherwise
        # count as this gameweek's first plan and stop the real one from notifying)
        if: always() && github.event.inputs.dry != 'true'
        run: scripts/data_publish.sh data_cache/out
      - name: Publish the plan for the Discord bot
        if: always()
        continue-on-error: true   # the bot's copy never fails the weekly run
        run: scripts/plan_publish.sh plan_out
      - name: Reply in Discord
        if: ${{ always() && inputs.discord_reply != '' }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KIND: ${{ github.event.inputs.dry == 'true' && 'Dry run' || 'Plan run' }}
        run: |
          f=$(ls -t plan_out/gw*.md 2>/dev/null | head -1 || true)
          uv run fpl-agent send --file "${f:-plan_log.txt}" --discord-token "$REPLY" \
            --header "$KIND ${{ job.status }} (<$RUN_URL>)" --empty "The run stopped before it printed anything."
