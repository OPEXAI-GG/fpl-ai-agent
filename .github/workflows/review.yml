name: review
# After the gameweek's points are final (the data workflow runs Tuesday 09:00 UTC), score the
# projections and the dry-run decision for that gameweek, and publish the reviews.
on:
  schedule:
    - cron: "30 10 * * 2"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK || secrets.Discord_webhook }}
      FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Restore database
        run: scripts/data_restore.sh data_cache/export
      - name: Review the latest finished gameweek
        run: |
          set -o pipefail   # a failed review must fail the step, not hide behind tee
          uv run fpl-agent db-update --db data_cache/football.duckdb --import-dir data_cache/export \
            --football-data E0 --points
          uv run fpl-agent review --db data_cache/football.duckdb --gw 0 \
            --export data_cache/out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lessons for the next plan
        continue-on-error: true  # the lessons never block publishing the reviews
        run: |
          uv run fpl-agent lessons --db data_cache/football.duckdb --gw 0 \
            --export data_cache/out --notify | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gameweek summary to Discord
        continue-on-error: true  # a failed summary never blocks publishing the reviews
        run: uv run fpl-agent gw-summary --notify | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish database
        run: scripts/data_publish.sh data_cache/out
